- req_ad_request
- req_empty_ad_response
- ad_request_impression
- slots
- ad_delivered_ad
- auction_request
- bids_received
- bids_filtered
- bids_delivered
- ack_ad_impression
- ack_ad_revenue:double
- ack_prog_ad_revenue_usd:double
- resp_duration
