query_disable_mode:
  ab_test_request: 0
  ab_test_ack: 0
  ab_test_perf_phase: 0
query_date_field:
  ab_test_request: timestamp
  ab_test_ack: timestamp
  ab_test_perf_phase: timestamp
query_data_source:
  ab_test_request: presto_gateway
  ab_test_ack: presto_gateway
  ab_test_perf_phase: presto_gateway
query_custom_config:
  ab_test_request: presto_tags=MEDIUM
  ab_test_ack: presto_tags=MEDIUM
  ab_test_perf_phase: presto_tags=LARGE
destinations: druid
granularity: 1h
execution_schedule: 2h
query_range: 5h
druid_datasource: traffic__ab_test__historical__hourly
druid_parameter: maxRowsPerSegment=3500000&maxRowsInMemory=10000
druid_template: ""

mode: 1
use_batch_id: 1
batch_id_filter:
  ab_test_request:
  ab_test_ack:
  ab_test_perf_phase: "dt = date_format(date_parse('${PROCESS_BATCH_ID}', '%Y%m%d%H0000'), '%Y-%m-%d-%H')"
date_time_filter:
  ab_test_request: ""
  ab_test_ack: ""
  ab_test_perf_phase: "REQUEST: dt >= date_format(timestamp '${START_TIME}' - interval '1' hour, '%Y-%m-%d-%H') and dt < date_format(timestamp '${END_TIME}', '%Y-%m-%d-%H') and from_unixtime(adserver_performance_log_record.timestamp) >= timestamp '${START_TIME}' and from_unixtime(adserver_performance_log_record.timestamp) < timestamp '${END_TIME}'"