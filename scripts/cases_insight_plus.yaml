# Hoover vs Hoover++ query parity -- every insight_plus case in one file,
# the same convention scripts/cases_biz_service.yaml already uses.
#
# One case per query under sql/insight_plus/. Some are PRISM-generated (their
# own banner says so, below their entry); f_demand_portfolio_hourly is
# hand-written and verified against a live cluster -- prism/tests/test_roundtrip.py
# checks PRISM's own derivation against it. Either way, EDIT CASES HERE: this
# is the one file rowparity list/run reads, and `python -m prism generate`
# merges a regenerated case back into its own entry here, in place, leaving
# every other case in the file untouched.

cases:
  - name: f_demand_mpe_hourly
    # Generated by PRISM from sql/insight_plus/f_demand_mpe_hourly.sql on 2026-09-22.
    #
    # PRISM derives what the query already states: the keys are its GROUP BY
    # dimensions, the breakdown column is the one dimension that is a distinct
    # literal per UNION branch, the unordered arrays are the ones that reach the
    # output from a source column rather than being constructed inline.
    #
    # EDIT THIS ENTRY. It is a first draft, not a contract. Re-running PRISM
    # overwrites only this case's own block, leaving every other case in this
    # file untouched.
    #
    # Source query: 147 output columns (36 dimensions + 111 metrics), 7 UNION branch(es).
    expected_label: Hoover
    actual_label: Hoover++
    description: >-
      The f_demand_mpe_hourly aggregate must produce identical rows whether built
      from the Hoover layout or the Hoover++ layout. Both
      sides are queries; neither is materialised.

    vars:
      sampling_filter: "bitwise_and(coalesce(request__bit_flags, BIGINT '0'),bitwise_left_shift(BIGINT '1', 59)) > 0"

    # The only difference between the two runs. These outrank --param
    # deliberately: a --param reaching both sides would point them at the
    # same catalog, and a comparison of a table with itself always passes.
    expected:
      type: trino
      query_file: ../sql/insight_plus/f_demand_mpe_hourly.sql
      vars:
        facts: mrm_log_flat.default

    actual:
      type: trino
      query_file: ../sql/insight_plus/f_demand_mpe_hourly.sql
      vars:
        facts: etl.public_test1

    compare:
      # The 36 GROUP BY dimensions. Not a business key, but unique by
      # construction after the outer aggregation, which is all a key has to be.
      # Keyed, a difference separates into missing/added (a dimension combination
      # is absent) and changed (same dimensions, drifting metrics). Keyless, every
      # difference is missing + added and every column reads as differing.
      keys:
        - ack_traffic_type
        - content_owner_id
        - content_owner_visibility
        - event_date
        - geo_country_visibility
        - global_advertiser_ids
        - global_brand_ids
        - inbound_order_id
        - market_ad_id
        - network_id
        - outbound_exchange_listing_ids
        - partition_key
        - primary_ad_indicator
        - process_batch_id
        - process_stage
        - request_traffic_type
        - sales_channel
        - site_section_id
        - slot_user_drop_off
        - standard_app_bundle_id
        - standard_brand_id
        - standard_brand_visibility
        - standard_channel_id
        - standard_channel_visibility
        - standard_device_type_id
        - standard_endpoint_id
        - standard_endpoint_owner_id
        - standard_endpoint_owner_visibility
        - standard_endpoint_visibility
        - standard_programmer_id
        - standard_programmer_visibility
        - standard_site_domain_id
        - stream_mode_id
        - supply_source
        - user_agent_visibility
        - user_country_id

      max_examples: 50

      # Find the single key column whose drift turned one logical row into a
      # missing + added pair. Costs no warehouse time: it re-pairs key tuples
      # already in memory.
      near_miss: true

    # How a differing row is digested in the report, instead of dumping a
    # 147-column dict truncated after the first four.
    # DERIVED FROM COLUMN NAMES, not from the query -- review these.
    row_summary:
      - {label: "Branch", columns: [partition_key, process_stage, slot_user_drop_off]}
      - {label: "Batch", columns: [event_date, process_batch_id]}
      - {label: "Network", columns: [content_owner_id, network_id, site_section_id]}
      - {label: "Ad identity", columns: [market_ad_id]}
      - {label: "Order", columns: [inbound_order_id, sales_channel]}
      - {label: "Placement", columns: [supply_source]}

    # Per-row investigation SQL, generated but NOT executed -- running both
    # sides was tried and taken back out: the two scans dominated the parity
    # run they were meant to annotate.
    tags: [insight_plus, prism]

