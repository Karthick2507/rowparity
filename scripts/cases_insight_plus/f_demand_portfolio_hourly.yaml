# Hoover vs Hoover++ query parity — f_demand_portfolio_hourly.
#   Hoover    mrm_log_flat.default.{ad,ack}   WITH the bit-59 sampling filter
#   Hoover++  etl.public_test1.{ad,ack}       WITH the same filter

cases:
  - name: f_demand_portfolio_hourly
    expected_label: Hoover
    actual_label: Hoover++
    description: >-
      The f_demand_portfolio_hourly aggregate must produce identical rows
      whether built from the Hoover layout (sampled to bit 59) or the Hoover++
      layout (already sampled). Both sides are queries; neither is materialised.
    # To run unsampled (both sides, together): --param sampling_filter=true
    vars:
      sampling_filter: "bitwise_and(coalesce(request__bit_flags, BIGINT '0'),bitwise_left_shift(BIGINT '1', 59)) > 0"

    expected:
      type: trino
      query_file: ../../sql/insight_plus/f_demand_portfolio_hourly.sql
      vars:
        facts: mrm_log_flat.default

    actual:
      type: trino
      query_file: ../../sql/insight_plus/f_demand_portfolio_hourly.sql
      vars:
        facts: etl.public_test1

    compare:
      keys:
        - ack_traffic_type
        - ad_id
        - bidding_buyer_id
        - buyer_group_id
        - buyer_id
        - buyer_platform_id
        - content_form_id
        - content_form_visibility
        - content_owner_id
        - content_owner_visibility
        - creative_id
        - deal_id
        - delivered_platform_device_id
        - distributor_id
        - dsp_id
        - event_date
        - evergreen_ad_indicator
        - geo_country_visibility
        - global_advertiser_ids
        - global_brand_ids
        - global_currency_id
        - global_currency_version
        - inbound_order_id
        - inbound_order_transaction_type
        - live_linear_indicator
        - local_advertiser_id
        - market_ad_id
        - network_id
        - outbound_exchange_listing_ids
        - outbound_exchange_order_id
        - outbound_order_id
        - partition_key
        - partner_tag_indicator
        - placement_id
        - primary_ad_indicator
        - priority_tier
        - priority_type
        - priority_value
        - process_batch_id
        - process_stage
        - profile_id
        - profile_type
        - promo_ad_indicator
        - request_fill_status
        - request_traffic_type
        - reseller_id
        - reseller_network_type
        - reseller_visibility
        - sales_channel
        - sales_strategy
        - site_id
        - site_section_id
        - slot_ad_unit_ids
        - slot_fill_status
        - slot_removed_by_constrained_indicator
        - slot_removed_by_ux_indicator
        - slot_sequence_normalized
        - slot_user_drop_off
        - ssp_bidder_indicator
        - standard_app_bundle_id
        - standard_app_id
        - standard_brand_id
        - standard_brand_visibility
        - standard_channel_id
        - standard_channel_visibility
        - standard_device_type_id
        - standard_endpoint_id
        - standard_endpoint_owner_id
        - standard_endpoint_owner_visibility
        - standard_endpoint_visibility
        - standard_environment_id
        - standard_os_id
        - standard_programmer_id
        - standard_programmer_visibility
        - standard_publisher_id
        - standard_site_domain_id
        - stream_mode_id
        - supply_source
        - supply_source_detail
        - time_position_classes
        - transaction_type
        - user_agent_visibility
        - user_country_id

      unordered_list_columns:
        - global_advertiser_ids
        - global_brand_ids

      max_examples: 50
      breakdown_by: slot_user_drop_off
      near_miss: true

    # How a differing row is digested in the report, instead of dumping a
    # 262-column dict truncated after the first four.
    row_summary:
      - {label: Branch,        columns: [slot_user_drop_off]}
      - {label: Batch,         columns: [process_batch_id, event_date]}
      - {label: Network,       columns: [network_id, content_owner_id, distributor_id]}
      - {label: Reseller,      columns: [reseller_id, reseller_visibility]}
      - {label: "Ad identity", columns: [ad_id, creative_id, placement_id, deal_id, dsp_id]}
      - {label: Fill,          columns: [request_fill_status, slot_fill_status]}
      - {label: Placement,     columns: [time_position_classes, supply_source_detail,
                                         sales_strategy, priority_tier]}


    drilldown:
      query_file: ../../sql/insight_plus/f_demand_portfolio_hourly_drilldown.sql
      bind:
        creative_id: "if(network_is_ad_owner, coalesce(advertisement__creative_id, -1), -1)"
      id_column: request__transaction_id
      #   kinds: [missing, added, changed]
      kinds: [missing]
      time:
        param: arena.presto.var.process_batch_id
        format: "%Y%m%d%H%M%S"
        hours_before: 1
        hours_after: 3
      vars:
        expected:
          time_filter: >-
            date_trunc('HOUR', cast(ack__timestamp as timestamp)) >= timestamp '${batch_hour_start}'
            and date_trunc('HOUR', cast(ack__timestamp as timestamp)) < timestamp '${batch_hour_end}'
        actual:
          time_filter: >-
            date_trunc('HOUR', cast(ack__timestamp as timestamp)) = timestamp '${batch_hour}'

    tags: [insight_plus, hoover]
